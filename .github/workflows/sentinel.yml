# Cronus Sentinel — scheduled endpoint monitor on GitHub Actions.
#
# DEPLOY (one-time):
#   1. Push this repo to GitHub. Make it PUBLIC: public repos get free Actions
#      minutes; a private repo at this cadence (~8,600 runs/month) blows past
#      the 2,000 free minutes.
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        TELEGRAM_BOT_TOKEN  = token from @BotFather
#        ENDPOINTS_JSON      = the full contents of your real endpoints.json
#      (Keep the committed endpoints.json as a harmless example. The secret
#       wins at runtime, so client URLs and chat IDs never appear publicly.)
#   3. Actions tab → "Cronus Sentinel" → Run workflow (dry_run = true) to test.
#
# TIMING:
#   GitHub's own schedule is best-effort and in practice fires every ~15-20
#   minutes, not every 5. So the real 5-minute beat comes from a tiny
#   Cloudflare Worker ("cronus-ticker", cron */5) that calls this workflow's
#   workflow_dispatch API with dry_run=false. The schedule below is only a
#   backup in case the ticker stops. Overlapping runs queue (see concurrency).
#
# KNOWN LIMITS (be honest with clients about these):
#   - A dispatched run usually starts within a minute, but GitHub can still
#     queue jobs during incidents.
#   - In public repos, scheduled workflows are auto-disabled after 60 days
#     with no repository activity (the ticker is not affected).

name: Cronus Sentinel

on:
  schedule:
    - cron: "*/15 * * * *"         # backup only; the Cloudflare ticker drives the 5-minute beat
  workflow_dispatch:                # used by the ticker (dry_run=false) and the manual button
    inputs:
      dry_run:
        description: "Print alerts to the log instead of sending them"
        type: boolean
        default: true
      test_alert:
        description: "Send one sample incident card to every alert channel, then stop (no checks)"
        type: boolean
        default: false

# Never let two runs overlap — they'd race on the failure-counter state.
concurrency:
  group: cronus-sentinel
  cancel-in-progress: false

permissions:
  contents: read                    # least privilege: read the code, nothing else

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4              # hard stop well before the next tick

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runners are wiped after every job, so consecutive-failure counters are
      # carried between runs through the Actions cache. restore-keys picks the
      # newest "sentinel-state-*" entry; a fresh key is saved at the end.
      - name: Restore failure-counter state
        uses: actions/cache/restore@v4
        with:
          path: .sentinel/state.json
          key: sentinel-state-${{ github.run_id }}
          restore-keys: sentinel-state-

      - name: Run sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENDPOINTS_JSON: ${{ secrets.ENDPOINTS_JSON }}
          # Scheduled and ticker runs send real alerts; manual runs follow the checkbox (default dry).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && '1' || '0' }}
          CONFIRM_DELAY_S: "20"     # re-probe failures once, 20 s later, in the same run
          REMINDER_EVERY_N: "6"     # while still down, re-alert every 6 failed checks
        run: python sentinel.py

      - name: Save failure-counter state
        if: always() && hashFiles('.sentinel/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .sentinel/state.json
          key: sentinel-state-${{ github.run_id }}-${{ github.run_attempt }}
